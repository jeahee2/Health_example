```html
<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>전국 의약품 사용실적 조회</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>
    <div class="header-inner">

        <h1>전국 의약품 사용실적 조회</h1>

        <p>
            성분별 의약품 사용량과 금액을 전국 시도별로 조회합니다.
        </p>

    </div>
</header>


<main>

    <!-- 성분코드 조회 -->
    <section class="card">

        <h2>성분코드 조회</h2>

        <div class="ingredient-search">

            <div class="form-group">

                <label for="ingredientCode">
                    성분코드
                </label>

                <input
                    type="text"
                    id="ingredientCode"
                    placeholder="성분코드를 입력하세요"
                >

            </div>


            <div class="form-group">

                <label for="ingredientName">
                    성분명칭
                </label>

                <input
                    type="text"
                    id="ingredientName"
                    placeholder="성분명칭을 입력하세요"
                >

            </div>


            <button
                type="button"
                id="ingredientSearchButton"
                class="primary-button"
            >
                성분 검색
            </button>

        </div>


        <div class="result-title">
            성분 검색 결과
        </div>


        <div id="ingredientResult">

            <div class="empty">
                성분코드 또는 성분명칭을 검색해주세요.
            </div>

        </div>

    </section>


    <!-- 선택된 성분 -->
    <section class="card selected-card">

        <h2>선택된 성분</h2>

        <div id="selectedIngredient">

            <span class="not-selected">
                선택된 성분이 없습니다.
            </span>

        </div>

    </section>


    <!-- 조회 조건 -->
    <section class="card">

        <h2>조회 조건</h2>

        <div class="search-grid">

            <div class="form-group">

                <label for="month">
                    진료년월
                </label>

                <input
                    type="month"
                    id="month"
                >

            </div>


            <div class="form-group">

                <label for="region">
                    시도
                </label>

                <select id="region">

                    <option value="전체">
                        전국
                    </option>

                    <option value="서울">서울</option>
                    <option value="부산">부산</option>
                    <option value="대구">대구</option>
                    <option value="인천">인천</option>
                    <option value="광주">광주</option>
                    <option value="대전">대전</option>
                    <option value="울산">울산</option>
                    <option value="세종">세종</option>
                    <option value="경기">경기</option>
                    <option value="강원">강원</option>
                    <option value="충북">충북</option>
                    <option value="충남">충남</option>
                    <option value="전북">전북</option>
                    <option value="전남">전남</option>
                    <option value="경북">경북</option>
                    <option value="경남">경남</option>
                    <option value="제주">제주</option>

                </select>

            </div>


            <div class="form-group">

                <label for="usageType">
                    조제·처방구분
                </label>

                <select id="usageType">

                    <option value="조제기준">
                        조제기준
                    </option>

                    <option value="처방기준">
                        처방기준
                    </option>

                </select>

            </div>


            <div class="button-area">

                <button
                    type="button"
                    id="searchButton"
                    class="primary-button"
                >
                    조회
                </button>

            </div>

        </div>

    </section>


    <!-- 요약 -->
    <section class="summary">

        <div class="summary-card">

            <div class="summary-label">
                총 수량
            </div>

            <div
                class="summary-value"
                id="totalQuantity"
            >
                -
            </div>

        </div>


        <div class="summary-card">

            <div class="summary-label">
                총 금액
            </div>

            <div
                class="summary-value"
                id="totalAmount"
            >
                -
            </div>

        </div>

    </section>


    <!-- 차트 -->
    <section class="card">

        <h2>전국 시도별 사용실적</h2>

        <div class="chart-container">

            <canvas id="usageChart"></canvas>

        </div>

    </section>


    <!-- 조회 결과 -->
    <section class="card">

        <div class="table-header">

            <h2>조회 결과</h2>

            <span id="resultCount">
                0건
            </span>

        </div>


        <div class="table-wrapper">

            <table>

                <thead>

                    <tr>

                        <th>진료년월</th>
                        <th>시도</th>
                        <th>조제·처방구분</th>
                        <th>수량</th>
                        <th>금액</th>

                    </tr>

                </thead>


                <tbody id="resultTable">

                    <tr>

                        <td
                            colspan="5"
                            class="empty"
                        >
                            조회 결과가 없습니다.
                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </section>

</main>


<script src="js/app.js"></script>

</body>

</html>
```
